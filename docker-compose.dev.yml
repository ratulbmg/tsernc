# =============================================================================
# Docker Compose — Development Environment
# =============================================================================
# Spins up three services:
#   db    → PostgreSQL 17 (persistent data via named volume)
#   api   → Express + nodemon (hot-reload via bind mount)
#   web   → Vite React SPA (hot-reload via bind mount)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d          # start
#   docker compose -f docker-compose.dev.yml down           # stop
#   docker compose -f docker-compose.dev.yml logs -f        # tail logs
#   docker compose -f docker-compose.dev.yml build --no-cache  # force rebuild
# =============================================================================

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: tsernc_postgres_data

services:
  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  db:
    image: postgres:17
    container_name: tsernc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # API — Express + Nodemon + tsx
  # --------------------------------------------------------------------------
  api:
    container_name: tsernc-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: yarn workspace api dev
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    environment:
      - NODE_ENV=development
      - API_NODE_ENV=development
      - API_PORT=${API_PORT:-3001}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/myapp
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    volumes:
      # Bind-mount the entire monorepo for live code sync
      - .:/app
      # ── Anonymous volumes ──
      # These prevent the host's node_modules from shadowing the
      # container's installed node_modules (OS / arch differences).
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/env/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/prettier-config/node_modules
      - /app/packages/typescript-config/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Web — Vite dev server (HMR enabled)
  # --------------------------------------------------------------------------
  web:
    container_name: tsernc-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    command: yarn workspace web dev
    ports:
      - "${VITE_WEB_PORT:-5173}:${VITE_WEB_PORT:-5173}"
    environment:
      - NODE_ENV=development
      - VITE_API_ENDPOINT_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      # Same anonymous-volume trick for node_modules
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/env/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/prettier-config/node_modules
      - /app/packages/typescript-config/node_modules
    depends_on:
      - api
    networks:
      - app-network